packages:
  - "packages/*"

allowBuilds:
  esbuild: true
  unrs-resolver: false

# First-party packages — no supply-chain cooldown for our own releases
minimumReleaseAgeExclude:
  - "@sebastian-gmbh/*"
  - "@sebastian-software/*"
  - ardo
  - brace-expansion@5.0.8 || 5.0.9
  - postcss@8.5.18 || 8.5.23
  - js-yaml@3.15.1 || 3.15.2
  - nanoid@3.3.16 || 3.3.18
  - browserslist@4.28.7
  - toml@4.1.2 || 4.2.0
  - baseline-browser-mapping@2.11.0

# remark-mdx-frontmatter still declares toml ^3; toml 4 retains its parse API
# and includes the fixes for GHSA-v5mp-jgw5-2x6j and GHSA-82x6-q7mm-w9cf.
overrides:
  toml@3: 4.2.0
