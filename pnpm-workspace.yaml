packages:
  - "packages/*"

allowBuilds:
  esbuild: true
  unrs-resolver: false

# First-party packages — no supply-chain cooldown for our own releases
minimumReleaseAgeExclude:
  - "@sebastian-gmbh/*"
  - "@sebastian-software/*"
  - ardo
  - js-yaml@3.15.2
  - toml@4.2.0

# remark-mdx-frontmatter still declares toml ^3; toml 4 retains its parse API
# and includes the fixes for GHSA-v5mp-jgw5-2x6j and GHSA-82x6-q7mm-w9cf.
overrides:
  toml@3: 4.2.0
