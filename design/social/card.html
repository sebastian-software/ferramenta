<!doctype html>
<!--
  The social card of ferramenta.dev (public/social.png, 1200×630): the Ferra
  paper ground, the family register and every engine's compact mark. It is a page, so a browser renders it; nothing
  here is code of its own. Re-render it when the line-up changes, after
  updating the strip below (one figure per engine, in catalog order):

    CHROME=/absolute/path/to/chromium pnpm social:write

  The renderer serves the repository so the local font and package assets load.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ferramenta social card</title>
    <link rel="stylesheet" href="../../packages/family/styles/ferra.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body.ferra-page {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 56px 64px;
      }
      .hero {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        align-items: center;
        gap: 32px;
        min-height: 350px;
      }
      .ferra-page h1 {
        font-size: 76px;
      }
      .subtitle {
        font-size: 30px;
        line-height: 1.3;
        margin-block: 18px;
      }
      .address {
        font-size: 20px;
        color: var(--ferra-accent);
      }
      .hero img {
        width: 100%;
      }
      .strip {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        margin-block-start: 46px;
        padding-block-start: 28px;
        border-block-start: 1px solid var(--ferra-border);
      }
      figure {
        display: grid;
        justify-items: center;
        gap: 12px;
      }
      figure img {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
      figcaption {
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body class="ferra-page">
    <div class="hero">
      <div>
        <h1>Ferramenta.</h1>
        <p class="subtitle">A family of Rust engines.</p>
        <p class="address">ferramenta.dev</p>
      </div>
      <img src="../../packages/family/ferra/ferramenta/instrument.webp" alt="" />
    </div>
    <div class="strip">
      <figure>
        <img src="../../packages/family/ferra/ferroni/mark-128.png" alt="" />
        <figcaption>Ferroni</figcaption>
      </figure>
      <figure>
        <img src="../../packages/family/ferra/ferriki/mark-128.png" alt="" />
        <figcaption>Ferriki</figcaption>
      </figure>
      <figure>
        <img src="../../packages/family/ferra/ferromark/mark-128.png" alt="" />
        <figcaption>Ferromark</figcaption>
      </figure>
      <figure>
        <img src="../../packages/family/ferra/ferrolex/mark-128.png" alt="" />
        <figcaption>Ferrolex</figcaption>
      </figure>
      <figure>
        <img src="../../packages/family/ferra/ferrocat/mark-128.png" alt="" />
        <figcaption>Ferrocat</figcaption>
      </figure>
      <figure>
        <img src="../../packages/family/ferra/ferralk/mark-128.png" alt="" />
        <figcaption>Ferralk</figcaption>
      </figure>
      <figure>
        <img src="../../packages/family/ferra/ferrugo/mark-128.png" alt="" />
        <figcaption>Ferrugo</figcaption>
      </figure>
      <figure>
        <img src="../../packages/family/ferra/ferrolink/mark-128.png" alt="" />
        <figcaption>Ferrolink</figcaption>
      </figure>
      <figure>
        <img src="../../packages/family/ferra/ferrigura/mark-128.png" alt="" />
        <figcaption>Ferrigura</figcaption>
      </figure>
    </div>
  </body>
</html>
