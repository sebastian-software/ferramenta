name: ci

on:
  pull_request:
  push:
    branches: [main]

# CI runs dependencies and repository code; it only needs to read the checkout.
permissions:
  contents: read

jobs:
  native-tooling:
    name: Native tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      # The native archive contract exercises real pnpm packing on every OS.
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - run: pnpm --filter ferramenta-native install --frozen-lockfile --ignore-scripts
      - run: node --test packages/native/test/*.test.mjs

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # README checks use this repository's native CLI pin.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.9.5
          install_args: --locked

      - run: pnpm install --frozen-lockfile

      - run: pnpm run --if-present lint

      - run: pnpm run --if-present format:check

      - run: pnpm run --if-present typecheck

      - run: pnpm run --if-present build

      - run: pnpm run --if-present test

      # `packages/family/dist` is committed (ADR-0007): git consumers install it
      # as it is. The build above regenerates it, so anything changed, added or
      # removed in that directory — untracked files included — means a commit
      # shipped build output that does not match its sources.
      - name: The committed package build output is current
        run: node scripts/check-committed-dist.mjs

      # Installs the package into a scratch project twice — the packed tarball
      # and the tracked files at HEAD — and imports both entry points the way a
      # sibling site does.
      - run: pnpm run verify:package
